# =============================================================================
# CD Pipeline — Deploy Infrastructure using mise
# =============================================================================
# Same as cd-deploy.yml but uses mise for tool management and task execution.
#
# Trigger options:
#   1. Automatically on push to main (deploys dev)
#   2. Manually via workflow_dispatch (choose dev or prod, plan/apply/destroy)
#
# Prerequisites — GitHub repository secrets:
#   - AZURE_CLIENT_ID
#   - AZURE_CLIENT_SECRET
#   - AZURE_SUBSCRIPTION_ID
#   - AZURE_TENANT_ID
# =============================================================================

name: CD — Deploy (mise)

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "mise.toml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: deploy-mise-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  ACTION: ${{ github.event.inputs.action || 'apply' }}

jobs:
  # ===========================================================================
  # Job 1: Plan
  # ===========================================================================
  plan:
    name: "Plan — ${{ github.event.inputs.environment || 'dev' }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install tools
        run: mise install

      # -----------------------------------------------------------------------
      # Azure credentials — set as env vars for the AzureRM provider
      # -----------------------------------------------------------------------
      - name: Set Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # Terraform init + plan via direct commands
      # (mise run plan would prompt for confirmation, so we call terraform directly)
      # -----------------------------------------------------------------------
      - name: Terraform Init
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform init -input=false

      - name: Terraform Plan
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          if [ "${{ env.ACTION }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan -input=false
          else
            terraform plan -out=tfplan -input=false
          fi

      - name: Upload plan artifact
        if: env.ACTION != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-mise-${{ env.ENVIRONMENT }}
          path: terraform/environments/${{ env.ENVIRONMENT }}/tfplan
          retention-days: 1

  # ===========================================================================
  # Job 2: Apply
  # ===========================================================================
  apply:
    name: "Apply — ${{ github.event.inputs.environment || 'dev' }}"
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ github.event.inputs.action != 'plan' }}
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install tools
        run: mise install

      - name: Set Azure credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-mise-${{ env.ENVIRONMENT }}
          path: terraform/environments/${{ env.ENVIRONMENT }}

      - name: Terraform Apply
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform apply -auto-approve tfplan

      - name: Show outputs
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          echo "## Deployment Outputs (${{ env.ENVIRONMENT }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | $(terraform output -raw resource_group_name) |" >> $GITHUB_STEP_SUMMARY
          echo "| Storage Account | $(terraform output -raw storage_account_name) |" >> $GITHUB_STEP_SUMMARY
          echo "| Databricks URL | $(terraform output -raw databricks_workspace_url) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed with mise-managed Terraform $(terraform version | head -1)" >> $GITHUB_STEP_SUMMARY
