[project]
name = "azure-databricks-platform-demo"
version = "0.1.0"
description = "Demo data platform with Azure Databricks, Terraform, and medallion architecture"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
data-generator = [
    "azure-storage-file-datalake>=12.14.0",
    "python-dotenv>=1.0.0",
]
query-client = [
    "databricks-sql-connector>=3.0.0",
    "azure-identity>=1.15.0",
]
cheatsheet = [
    "fpdf2>=2.7.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
